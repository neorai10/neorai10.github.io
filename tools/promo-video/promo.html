<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>סופר קור נהריה - סרטון תדמית (מקור)</title>
<meta name="robots" content="noindex">
<!--
  מקור הסרטון שמוצג בסוף דף הבית.
  כל האנימציות הן CSS; הסקריפט render.js "מגלגל" את ציר הזמן פריים-פריים ומקודד ל-MP4.
  לשינוי טקסט/תמונות: ערכו כאן והריצו שוב  node tools/promo-video/render.js
-->
<style>
@font-face { font-family: 'Heebo'; font-weight: 100 900; src: url('../../fonts/heebo-hebrew.woff2') format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
@font-face { font-family: 'Heebo'; font-weight: 100 900; src: url('../../fonts/heebo-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #041225; }
body { font-family: 'Heebo', sans-serif; color: #fff; }
.stage {
    position: relative; width: 1280px; height: 720px; overflow: hidden;
    background:
        radial-gradient(900px 500px at 85% -10%, rgba(0,187,240,.35), transparent 60%),
        radial-gradient(800px 500px at 0% 110%, rgba(0,87,146,.7), transparent 60%),
        linear-gradient(160deg, #041225, #0a2748);
}
.glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; filter: blur(90px); background: #00bbf0; opacity: .35; top: -160px; left: 120px; animation: drift 24s linear both; }
@keyframes drift { to { transform: translate(380px, 260px) scale(1.3); } }

/* פתיתי שלג */
.flake { position: absolute; top: -20px; border-radius: 50%; background: #cdefff; animation: fall linear both; }
@keyframes fall { to { transform: translate(60px, 780px); } }

/* סצנה: מופיעה ב---s ונעלמת אחרי --d */
.scene { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; opacity: 0; animation: scene var(--d) linear var(--s) both; }
@keyframes scene { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
.scene.last { animation-name: sceneLast; }
@keyframes sceneLast { 0% { opacity: 0; } 10%, 100% { opacity: 1; } }

.in { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) calc(var(--s) + var(--t, 0s)) both; }
@keyframes in { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
.pop { opacity: 0; animation: pop .9s cubic-bezier(.2,1.4,.3,1) calc(var(--s) + var(--t, 0s)) both; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }

/* 1 - פתיחה */
.logo { width: 150px; height: 150px; border-radius: 40px; margin: 0 auto 34px; display: grid; place-items: center; background: linear-gradient(135deg, #00bbf0, #005792); box-shadow: 0 20px 70px rgba(0,187,240,.55); }
.logo svg { width: 96px; height: 96px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; animation: spin 3.4s cubic-bezier(.2,.7,.2,1) var(--s) both; }
@keyframes spin { from { transform: rotate(-200deg); } to { transform: rotate(0); } }
.title { font-size: 104px; font-weight: 900; letter-spacing: -2px; line-height: 1.05; }
.title b { font-weight: 900; background: linear-gradient(90deg, #7fe8ff, #00bbf0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: 40px; font-weight: 500; color: #cfe6f7; margin-top: 18px; }

/* 2 - ניסיון */
.big { font-size: 300px; font-weight: 900; line-height: .9; background: linear-gradient(180deg, #fff, #5fe0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.big-label { font-size: 78px; font-weight: 900; margin-top: 6px; }

/* 3 - פרויקטים */
.photo { place-items: stretch; }
.photo .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(30px) brightness(.45); }
.photo .frame { position: absolute; inset: 30px 40px 156px; display: flex; align-items: center; justify-content: center; }
.photo img { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); border: 4px solid rgba(255,255,255,.9); animation: kb var(--d) linear var(--s) both; }
@keyframes kb { from { transform: scale(.94); } to { transform: scale(1.04); } }
.caption { position: absolute; inset: auto 0 0 0; height: 130px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; background: linear-gradient(to top, rgba(4,18,37,.96), rgba(4,18,37,.7)); text-align: right; }
.caption h2 { font-size: 46px; font-weight: 900; }
.caption p { font-size: 28px; color: #9fd9f5; font-weight: 500; }
.tag { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 900; direction: rtl; }
.tag i { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, #00bbf0, #005792); }
.tag svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* 4 - שירותים */
.heading { font-size: 70px; font-weight: 900; margin-bottom: 44px; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 980px; margin: 0 auto; }
.chip { font-size: 44px; font-weight: 800; padding: 30px 20px; border-radius: 28px; background: rgba(255,255,255,.09); border: 2px solid rgba(127,232,255,.45); }

/* 5 - סיום */
.cta-small { font-size: 46px; font-weight: 700; color: #cfe6f7; }
.phone { font-size: 150px; font-weight: 900; direction: ltr; line-height: 1.1; margin: 10px 0 6px; background: linear-gradient(90deg, #fff, #7fe8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.name { font-size: 40px; font-weight: 600; color: #cfe6f7; }
.url { display: inline-block; margin-top: 34px; font-size: 46px; font-weight: 900; direction: ltr; padding: 14px 46px; border-radius: 999px; background: linear-gradient(135deg, #0a84d6, #005792); box-shadow: 0 16px 50px rgba(0,140,220,.55); }

/* ===== גרסה אנכית לרילס/סטורי (1080x1920): promo.html?format=reel ===== */
.reel, .reel body, .reel .stage { width: 1080px; height: 1920px; }
.reel .glow { width: 800px; height: 800px; top: 100px; left: 0; }
.reel .flake { animation-name: fallReel; }
@keyframes fallReel { to { transform: translate(80px, 2000px); } }
.reel .logo { width: 240px; height: 240px; border-radius: 64px; margin-bottom: 60px; }
.reel .logo svg { width: 150px; height: 150px; }
.reel .title { font-size: 170px; }
.reel .title b { display: block; }
.reel .sub { font-size: 58px; margin-top: 30px; padding: 0 60px; }
.reel .big { font-size: 520px; }
.reel .big-label { font-size: 130px; }
.reel .photo .frame { inset: 200px 50px 520px; }
.reel .photo img { border-radius: 36px; border-width: 6px; }
.reel .caption { height: 440px; flex-direction: column; justify-content: center; align-items: center; gap: 44px; text-align: center; padding: 0 50px; }
.reel .caption h2 { font-size: 76px; line-height: 1.15; }
.reel .caption p { font-size: 44px; margin-top: 10px; }
.reel .tag { font-size: 40px; }
.reel .tag i { width: 70px; height: 70px; border-radius: 20px; }
.reel .tag svg { width: 44px; height: 44px; }
.reel .heading { font-size: 104px; line-height: 1.15; margin-bottom: 70px; padding: 0 60px; }
.reel .chips { grid-template-columns: 1fr; width: 860px; gap: 34px; }
.reel .chip { font-size: 64px; padding: 44px 20px; border-radius: 40px; }
.reel .cta-small { font-size: 62px; padding: 0 60px; line-height: 1.3; }
.reel .phone { font-size: 158px; margin: 40px 0 20px; }
.reel .name { font-size: 54px; }
.reel .url { font-size: 66px; margin-top: 70px; padding: 22px 70px; }
</style>
<script>if (/format=reel/.test(location.search)) document.documentElement.classList.add('reel');</script>
</head>
<body>
<div class="stage">
    <div class="glow"></div>
    <div id="snow"></div>

    <!-- 1: פתיחה -->
    <section class="scene" style="--s:0s; --d:3.4s">
        <div>
            <div class="logo pop"><svg viewBox="0 0 24 24"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg></div>
            <h1 class="title in" style="--t:.5s">סופר קור <b>נהריה</b></h1>
            <p class="sub in" style="--t:.9s">מיזוג אוויר ביתי ותעשייתי</p>
        </div>
    </section>

    <!-- 2: ניסיון -->
    <section class="scene" style="--s:3.2s; --d:3s">
        <div>
            <p class="big pop">30</p>
            <p class="big-label in" style="--t:.35s">שנות ניסיון</p>
            <p class="sub in" style="--t:.7s">התקנה · תיקון · שירות למזגנים</p>
        </div>
    </section>

    <!-- 3: פרויקטים (נבנה בסקריפט למטה) -->
    <div id="photos"></div>

    <!-- 4: שירותים -->
    <section class="scene" style="--s:18s; --d:3.2s">
        <div>
            <h2 class="heading in">כל פתרונות המיזוג במקום אחד</h2>
            <div class="chips">
                <p class="chip pop" style="--t:.3s">מזגנים עיליים</p>
                <p class="chip pop" style="--t:.5s">מיני מרכזי</p>
                <p class="chip pop" style="--t:.7s">מערכות VRF</p>
                <p class="chip pop" style="--t:.9s">שירות חירום 24/6</p>
            </div>
        </div>
    </section>

    <!-- 5: סיום -->
    <section class="scene last" style="--s:21s; --d:3s">
        <div>
            <p class="cta-small in">הצעת מחיר חינם - חייגו עכשיו</p>
            <p class="phone pop" style="--t:.3s">052-2613282</p>
            <p class="name in" style="--t:.6s">ברוך · סופר קור נהריה</p>
            <p class="url in" style="--t:.9s">superkor.co.il</p>
        </div>
    </section>
</div>

<script>
// תמונות הפרויקטים: [קובץ, כותרת, מיקום]
var PHOTOS = [
    ['work3.webp',  'התקנת מזגנים עיליים', 'דירה בנהריה - 4 יחידות תדיראן'],
    ['work10.webp', 'מיזוג קומפלט לדירה', 'נהריה'],
    ['work2.webp',  'מערכת VRF BOX', 'משרדים בראש הנקרה'],
    ['work7.webp',  'יחידה נסתרת', 'דירה בעכו'],
    ['work5.webp',  'מזגן עילי בממ"ד', 'דירה בנהריה'],
    ['work12.webp', 'מיזוג קומפלט לדירה', 'נהריה']
];
var START = 6, EACH = 2.1;
var SNOW = '<svg viewBox="0 0 24 24"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg>';
document.getElementById('photos').innerHTML = PHOTOS.map(function (p, i) {
    var src = '../../images/' + p[0];
    return '<section class="scene photo" style="--s:' + (START + i * (EACH - .1)).toFixed(2) + 's; --d:' + EACH + 's">' +
        '<div class="bg" style="background-image:url(' + src + ')"></div>' +
        '<div class="frame"><img src="' + src + '" alt=""></div>' +
        '<div class="caption"><div><h2>' + p[1] + '</h2><p>' + p[2] + '</p></div>' +
        '<div class="tag">סופר קור נהריה <i>' + SNOW + '</i></div></div></section>';
}).join('');

// שלג דטרמיניסטי (אותו סרטון בכל רינדור)
var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
var flakes = '';
for (var i = 0; i < 46; i++) {
    var size = 3 + rnd() * 6, dur = 7 + rnd() * 9;
    flakes += '<i class="flake" style="left:' + (rnd() * (document.documentElement.classList.contains('reel') ? 1080 : 1280)).toFixed(0) + 'px;width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) +
        'px;opacity:' + (.25 + rnd() * .5).toFixed(2) + ';animation-duration:' + dur.toFixed(1) + 's;animation-delay:-' + (rnd() * dur).toFixed(1) + 's;animation-iteration-count:infinite"></i>';
}
document.getElementById('snow').innerHTML = flakes;
</script>
</body>
</html>
